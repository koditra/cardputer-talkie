<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CardTalk</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: monospace;
}

body {
    background: #06080b;
    color: #33ff88;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#app {
    width: min(720px,95vw);
    height: 92vh;
    display: flex;
    flex-direction: column;
    border: 2px solid #33ff88;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 20px #00ff6640;
}

header {
    background: #09110d;
    border-bottom: 1px solid #33ff88;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    letter-spacing: 2px;
    font-size: 22px;
}

#status {
    color: #ff6666;
}

#status.online {
    color: #33ff88;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    background: #050607;
}

.msg {
    padding: 8px 10px;
    margin-bottom: 8px;
    border-left: 4px solid #33ff88;
    background: #111;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-word;
}

.msg.system {
    border-left-color: #ffaa33;
    color: #ffcc66;
}

.msg.me {
    border-left-color: #44bbff;
    color: #8fd8ff;
}

.msg.remote {
    border-left-color: #33ff88;
}

footer {
    background: #09110d;
    border-top: 1px solid #33ff88;
    display: flex;
    gap: 10px;
    padding: 12px;
}

input {
    flex: 1;
    background: #111;
    color: #33ff88;
    border: 1px solid #33ff88;
    padding: 12px;
    outline: none;
}

button {
    background: #33ff88;
    color: black;
    border: none;
    padding: 12px 20px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #55ffaa;
}

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-thumb {
    background: #33ff88;
}
</style>
</head>

<body>

<div id="app">

<header>
    <h1>CARDTALK</h1>
    <div id="status">● Offline</div>
</header>

<div id="chat"></div>

<footer>
    <input id="message" placeholder="Type message...">
    <button id="send">SEND</button>
</footer>

</div>

<script>

let ws;

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const status = document.getElementById("status");

function addMessage(text, cls = "remote") {

    const div = document.createElement("div");

    div.className = "msg " + cls;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

}

function connect() {

    const protocol =
        location.protocol === "https:"
            ? "wss://"
            : "ws://";

    ws = new WebSocket(protocol + location.host);

    ws.onopen = () => {

        status.textContent = "● Connected";
        status.className = "online";

        addMessage("Connected to CardTalk", "system");

    };

    ws.onclose = () => {

        status.textContent = "● Offline";
        status.className = "";

        addMessage("Disconnected from CardTalk", "system");

        setTimeout(connect, 2000);

    };

    ws.onmessage = e => {

        const data = JSON.parse(e.data);

        if (data.type === "history") {

            chat.innerHTML = "";

            for (const msg of data.messages) {

                const cls =
                    msg.sender === "Me"
                        ? "me"
                        : msg.sender === "SYSTEM"
                            ? "system"
                            : "remote";

                addMessage(
                    `[${msg.time}] ${msg.sender}: ${msg.text}`,
                    cls
                );

            }

            return;

        }

        if (data.type === "chat") {

            const cls =
                data.sender === "Me"
                    ? "me"
                    : data.sender === "SYSTEM"
                        ? "system"
                        : "remote";

            addMessage(
                `[${data.time}] ${data.sender}: ${data.text}`,
                cls
            );

        }

        if (data.type === "clients") {

            status.textContent =
                `● Connected (${data.count})`;

            status.className = "online";

        }

    };

}

function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    if (ws.readyState !== WebSocket.OPEN) return;

    ws.send(JSON.stringify({
        type: "chat",
        text
    }));

    input.value = "";

}

document.getElementById("send").onclick = sendMessage;

input.addEventListener("keydown", e => {

    if (e.key === "Enter")
        sendMessage();

});

connect();

</script>

</body>
</html>
