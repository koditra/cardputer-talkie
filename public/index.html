<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CardTalk</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {
    height: 100vh;
    background: #0b0e14;
    color: #e0e6ed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 24px 16px;
}

h1 {
    color: #00e676;
    letter-spacing: 3px;
}

.status {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    color: #8a99ad;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: red;
}

.connected {
    background: #00e676;
}

.chat {
    width: 100%;
    max-width: 400px;
    height: 60vh;
    overflow-y: auto;
    background: #111827;
    border-radius: 15px;
    padding: 15px;
}

.message {
    background: #1e293b;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.input {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #00e676;
    font-weight: bold;
    cursor: pointer;
}

footer {
    color: #64748b;
}
</style>

</head>

<body>

<header>
    <h1>CardTalk</h1>

    <div class="status">
        <div id="dot" class="dot"></div>
        <div id="status">Disconnected</div>
    </div>
</header>

<div id="chat" class="chat"></div>

<div class="input">
    <input id="msg" placeholder="Type message...">
    <button onclick="send()">SEND</button>
</div>

<footer>
    Connected Clients:
    <strong id="clients">0</strong>
</footer>

<script>

let ws;

const status = document.getElementById("status");
const dot = document.getElementById("dot");
const chat = document.getElementById("chat");
const clients = document.getElementById("clients");
const msg = document.getElementById("msg");

function connect() {

    let protocol = location.protocol === "https:" ? "wss://" : "ws://";

    ws = new WebSocket(protocol + location.host);

    ws.onopen = () => {
        status.innerText = "Connected";
        dot.classList.add("connected");
    };

    ws.onclose = () => {
        status.innerText = "Disconnected";
        dot.classList.remove("connected");
        setTimeout(connect, 2000);
    };

    ws.onmessage = e => {

        let data = JSON.parse(e.data);

        if (data.type === "clients") {
            clients.innerText = data.count;
        }

        if (data.type === "message") {
            addMessage(data.sender + ": " + data.text);
        }

    };

}

function send() {

    if (!msg.value) return;

    ws.send(JSON.stringify({
        type: "message",
        text: msg.value
    }));

    addMessage("Me: " + msg.value);

    msg.value = "";

}

function addMessage(text) {

    let div = document.createElement("div");

    div.className = "message";
    div.innerText = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}

msg.addEventListener("keydown", e => {
    if (e.key === "Enter") send();
});

connect();

</script>

</body>
</html>
