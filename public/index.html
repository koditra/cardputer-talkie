<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardTalk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body {
      min-height: 100vh;
      background: #050608;
      color: #33ff88;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #app {
      width: min(900px, 100%);
      height: min(92vh, 900px);
      display: flex;
      flex-direction: column;
      border: 2px solid #33ff88;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px #00ff4433;
      background: #060708;
    }
    header, footer {
      background: #08110d;
      border-color: #33ff88;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
    }
    header { justify-content: space-between; border-bottom: 1px solid #33ff88; }
    footer { border-top: 1px solid #33ff88; }
    header h1 { font-size: 22px; letter-spacing: 3px; }
    #info { display: flex; gap: 18px; align-items: center; }
    #status { color: #ff6666; }
    #status.online { color: #33ff88; }
    #clients { color: #66ddff; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #060708;
    }
    .message {
      background: #111;
      border-left: 3px solid #33ff88;
      padding: 8px 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .system { border-left-color: orange; color: #ffd27a; }
    .you { border-left-color: #66ccff; }
    input {
      flex: 1;
      background: #111;
      color: #33ff88;
      border: 1px solid #33ff88;
      padding: 12px;
      outline: none;
      font-size: 15px;
    }
    button {
      background: #33ff88;
      color: black;
      border: none;
      padding: 12px 22px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #66ffaa; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #33ff88; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>CARDTALK</h1>
      <div id="info">
        <div id="clients">Clients: 0</div>
        <div id="status">● Offline</div>
      </div>
    </header>
    <div id="chat"></div>
    <footer>
      <input id="message" type="text" placeholder="Type message..." autocomplete="off" />
      <button id="send">SEND</button>
    </footer>
  </div>
  <script>
    let ws;
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const status = document.getElementById("status");
    const clients = document.getElementById("clients");

    function addMessage(text, cls = "") {
      const div = document.createElement("div");
      div.className = "message " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss://" : "ws://";
      ws = new WebSocket(protocol + location.host);

      ws.onopen = () => {
        status.textContent = "● Online";
        status.classList.add("online");
      };

      ws.onclose = () => {
        status.textContent = "● Offline";
        status.classList.remove("online");
        setTimeout(connect, 1500);
      };

      ws.onerror = () => {
        status.textContent = "● Offline";
        status.classList.remove("online");
      };

      ws.onmessage = event => {
        let packet;
        try { packet = JSON.parse(event.data); } catch { return; }
        if (!packet || !packet.type) return;

        if (packet.type === "history") {
          chat.innerHTML = "";
          for (const msg of packet.messages || []) {
            addMessage(`[${msg.time}] ${msg.sender}: ${msg.text}`, msg.sender === "System" ? "system" : "");
          }
          return;
        }

        if (packet.type === "chat") {
          addMessage(`[${packet.time}] ${packet.sender}: ${packet.text}`, packet.sender === "System" ? "system" : "");
          return;
        }

        if (packet.type === "clients") {
          clients.textContent = "Clients: " + packet.count;
        }
      };
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "chat", text }));
      input.value = "";
      input.focus();
    }

    sendButton.onclick = sendMessage;
    input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
    connect();
  </script>
</body>
</html>
