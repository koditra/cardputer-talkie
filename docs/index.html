<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CardTalk</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0e14;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-top: 8px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 3px;
      color: #00e676;
      text-transform: uppercase;
    }

    .status-bar {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #8a99ad;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff5252;
    }

    .status-dot.connected {
      background: #00e676;
    }

    .ptt-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .ptt-btn {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      border: 4px solid #1a2332;
      background: radial-gradient(circle,#1e293b 0%,#0f172a 100%);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .1s;
      touch-action: manipulation;
    }

    .ptt-btn.transmitting {
      transform: scale(.95);
      background: radial-gradient(circle,#ff1744 0%,#b71c1c 100%);
      border-color: #ff5252;
      box-shadow: 0 0 35px rgba(255,23,68,.5);
    }

    .tx-label {
      margin-top: 20px;
      min-height: 24px;
      color: #ff5252;
      font-weight: 600;
    }

    footer {
      color: #64748b;
    }
  </style>
</head>

<body>

<header>
  <h1>CardTalk</h1>

  <div class="status-bar">
    <span id="dot" class="status-dot"></span>
    <span id="status-text">Mock Connected</span>
  </div>
</header>

<div class="ptt-container">
  <div id="ptt" class="ptt-btn">
    <span>HOLD TO</span>
    <span>TALK</span>
  </div>

  <div id="tx-status" class="tx-label"></div>
</div>

<footer>
  Connected Clients:
  <strong id="client-count" style="color:#00e676;">2</strong>
</footer>

<script>
const pttBtn = document.getElementById("ptt");
const txStatus = document.getElementById("tx-status");
const dot = document.getElementById("dot");

dot.classList.add("connected");

let mediaRecorder;
let stream;
let recording = false;

async function startRecording() {
    if (recording) return;

    try {
        if (!stream) {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: true
            });
        }

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e => {
            console.log(
                "Audio chunk:",
                e.data.size,
                "bytes"
            );
        };

        mediaRecorder.start(100);

        recording = true;

        pttBtn.classList.add("transmitting");
        txStatus.textContent = "TRANSMITTING...";
    }
    catch (err) {
        console.error(err);
        alert("Microphone permission denied.");
    }
}

function stopRecording() {
    if (!recording) return;

    recording = false;

    mediaRecorder.stop();

    pttBtn.classList.remove("transmitting");
    txStatus.textContent = "";
}

pttBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    startRecording();
});

window.addEventListener("pointerup", stopRecording);
window.addEventListener("pointercancel", stopRecording);
</script>

</body>
</html>
